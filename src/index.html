<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stash</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./img/favicon/favicon.ico" />
    <link href="./input.css" rel="stylesheet" />
  </head>
  <!-- *******BODY******* -->
  <body class="dark:text-light-cream text-dark-black text-sm sm:text-base">
    <!-- Background Color -->
    <div class="fixed inset-0 z-[-20] bg-white"></div>
    <div
      class="fixed inset-0 -z-20 bg-black opacity-0 transition-opacity duration-500 dark:opacity-100"
    ></div>
    <!-- Background Effects -->
    <div class="relative">
      <!-- Light Grid -->
      <div
        class="absolute inset-0 bg-[linear-gradient(to_right,#f0f0f0_1px,transparent_1px),linear-gradient(to_bottom,#f0f0f0_1px,transparent_1px)] bg-[size:3rem_3rem] opacity-100 transition-opacity duration-500 sm:bg-[size:4rem_4rem] lg:bg-[size:5rem_5rem] dark:opacity-0"
      ></div>
      <!-- Dark Grid -->
      <div
        class="absolute inset-0 bg-[linear-gradient(to_right,#332b1772_1px,transparent_1px),linear-gradient(to_bottom,#332b1772_1px,transparent_1px)] bg-[size:3rem_3rem] opacity-0 transition-opacity duration-500 sm:bg-[size:4rem_4rem] lg:bg-[size:5rem_5rem] dark:opacity-100"
      ></div>
      <!-- Top Glow -->
      <div
        class="pointer-events-none absolute top-0 right-0 h-[100vh] w-full bg-[radial-gradient(circle_250px_at_100%_200px,rgba(250,204,21,0.32),transparent)] lg:bg-[radial-gradient(circle_500px_at_100%_200px,rgba(250,204,21,0.32),transparent)]"
      ></div>

      <!-- ***--***LAYOUT***--*** -->
      <div class="layout relative lg:flex">
        <!-- *********MENU******** -->
        <!-- Navbar -->
        <nav class="sticky top-0 z-50 h-[3.75rem] w-full p-3 lg:hidden">
          <!-- Open Nav BTN -->
          <button
            type="button"
            class="btn-nav--open rounded-md p-2 text-center hover:bg-gray-200/50 dark:hover:bg-gray-600/50"
          >
            <img src="./img/icons/menu.svg" alt="menu" class="h-5 w-5" />
          </button>
        </nav>
        <!-- Nav Overlay -->
        <div
          class="overlay fixed inset-0 z-40 hidden bg-black/30 backdrop-blur-[3px] lg:hidden"
        ></div>

        <!-- Sidebar -->
        <aside
          class="aside dark:border-light-cream/20 border-dark-black/20 bg-light-cream dark:bg-dark-black fixed top-0 left-0 z-100 flex h-screen w-[10rem] -translate-x-full flex-col gap-4 border-r-1 p-3 transition-transform duration-500 lg:sticky lg:top-0 lg:w-[clamp(3rem,5vw,4.5rem)] lg:translate-x-0 lg:bg-white/40 lg:transition-[width] lg:duration-500 lg:dark:bg-black/40"
        >
          <!-- Close Nav BTN -->
          <div class="aside-head flex flex-row justify-between">
            <img
              src="./img/stash-logo-s.png"
              alt="stash logo"
              class="stash-logo-s my-2 h-5 w-5 lg:mx-2"
            />
            <img
              src="./img/stash-logo-full.png"
              alt="stash logo"
              class="stash-logo-full my-2 hidden h-5 w-15 transition-transform duration-500 lg:mx-2"
            />
            <button
              type="button"
              class="btn-nav--close rounded-md p-2 text-center text-sm leading-5 font-medium hover:bg-gray-200/50 lg:hidden dark:hover:bg-gray-600/50"
            >
              <img src="./img/icons/close.svg" alt="menu" class="h-5 w-5" />
            </button>
          </div>

          <!-- Toggle Aside BTN -->
          <div class="group relative">
            <button
              type="button"
              class="btn-aside--toggle hidden h-[3rem] w-full grid-cols-[1.25rem_1fr] items-center justify-items-start gap-4 rounded-md p-2 text-sm leading-5 font-medium hover:bg-gray-200/50 lg:inline-grid dark:hover:bg-gray-600/50"
            >
              <img
                src="./img/icons/show_sidepanel.svg"
                alt="show sidebar"
                class="aside-icon--show col-start-1 row-start-1 h-5 w-5"
              />

              <img
                src="./img/icons/hide_sidepanel.svg"
                alt="hide sidebar"
                class="aside-icon--hide col-start-1 row-start-1 hidden h-5 w-5"
              />

              <p class="aside-text transition-opacity duration-300 lg:hidden">
                Close Sidebar
              </p>
            </button>

            <span
              class="dark:text-light-cream text-dark-black tooltip dark:border-light-cream/20 border-dark-black/20 invisible absolute top-2 left-full ml-2 rounded-full border-1 bg-gray-200/80 px-2 py-1 text-sm font-bold whitespace-nowrap opacity-0 group-hover:visible group-hover:opacity-100 dark:bg-gray-600/80"
            >
              Open Sidebar
            </span>
          </div>

          <!-- Switch Theme BTN -->
          <div class="group relative">
            <button
              type="button"
              class="btn-theme grid h-[3rem] w-full grid-cols-[1.25rem_1fr] items-center justify-items-start gap-3 rounded-md p-2 text-sm leading-5 font-medium hover:bg-gray-200/50 lg:inline-grid dark:hover:bg-gray-600/50"
            >
              <img
                src="./img/icons/sun.svg"
                alt="light theme"
                class="light-theme col-start-1 row-start-1 h-5 w-5 transition-all duration-500"
              />

              <img
                src="./img/icons/moon.svg"
                alt="dark theme"
                class="dark-theme col-start-1 row-start-1 h-5 w-5 scale-0 rotate-90 opacity-0 transition-all duration-500"
              />

              <p
                class="aside-text text-sm whitespace-nowrap transition-opacity duration-300 lg:hidden"
              >
                Switch Theme
              </p>
            </button>
            <span
              class="dark:text-light-cream text-dark-black tooltip dark:border-light-cream/20 border-dark-black/20 invisible absolute top-2 left-full ml-2 rounded-full border-1 bg-gray-200/80 px-2 py-1 text-sm font-bold whitespace-nowrap opacity-0 group-hover:visible group-hover:opacity-100 dark:bg-gray-600/80"
            >
              Switch Theme
            </span>
          </div>

          <!-- Watchlist BTN -->
          <div class="group relative">
            <button
              type="button"
              class="grid h-[3rem] w-full grid-cols-[1.25rem_1fr] items-center justify-items-start gap-4 rounded-md p-2 text-sm leading-5 font-medium hover:bg-gray-200/50 lg:inline-grid dark:hover:bg-gray-600/50"
            >
              <img
                src="./img/icons/video_playlist.svg"
                alt="watchlist"
                class="col-start-1 row-start-1 h-5 w-5"
              />

              <p class="aside-text transition-opacity duration-300 lg:hidden">
                Watchlist
              </p>
            </button>
            <span
              class="dark:text-light-cream text-dark-black tooltip dark:border-light-cream/20 border-dark-black/20 invisible absolute top-2 left-full ml-2 rounded-full border-1 bg-gray-200/80 px-2 py-1 text-sm font-bold whitespace-nowrap opacity-0 group-hover:visible group-hover:opacity-100 dark:bg-gray-600/80"
            >
              Watchlist
            </span>
          </div>
        </aside>

        <!-- ********MAIN******* -->
        <main
          class="main flex min-h-[calc(100vh-3.75rem)] flex-1 flex-col items-center justify-center lg:min-h-screen"
        >
          <div
            class="main-content mx-auto flex w-[90%] max-w-[75rem] flex-col items-center gap-9"
          >
            <!-- Header -->
            <h1
              class="text-3xl leading-tight font-bold sm:text-4xl lg:text-5xl"
            >
              <span class="inline-block overflow-hidden align-bottom">
                <span
                  class="inline-block animate-[text-reveal_0.8s_cubic-bezier(0.77,0,0.175,1)_both]"
                  style="animation-delay: 0s"
                >
                  Discover,
                </span>
              </span>

              <span class="inline-block overflow-hidden align-bottom">
                <span
                  class="inline-block animate-[text-reveal_0.8s_cubic-bezier(0.77,0,0.175,1)_both]"
                  style="animation-delay: 0.05s"
                >
                  save,
                </span>
              </span>

              <span class="inline-block overflow-hidden align-bottom">
                <span
                  class="inline-block animate-[text-reveal_0.8s_cubic-bezier(0.77,0,0.175,1)_both]"
                  style="animation-delay: 0.1s"
                >
                  and
                </span>
              </span>

              <span class="inline-block overflow-hidden align-bottom">
                <span
                  class="inline-block animate-[text-reveal_0.8s_cubic-bezier(0.77,0,0.175,1)_both]"
                  style="animation-delay: 0.15s"
                >
                  <span
                    class="animate-[shine_7s_linear_infinite] bg-[radial-gradient(ellipse_at_center,rgba(255,255,255,0.9)_0%,rgba(255,255,255,0.5)_15%,transparent_45%),linear-gradient(to_right,#eab308,#fde047)] bg-[length:200%_100%,100%_100%] bg-clip-text text-transparent drop-shadow-[0_0_12px_rgba(250,204,21,0.35)]"
                  >
                    Stash
                  </span>
                </span>
              </span>

              <span class="inline-block overflow-hidden align-bottom">
                <span
                  class="inline-block animate-[text-reveal_1s_cubic-bezier(0.77,0,0.175,1)_both] [animation-delay:0.25s]"
                >
                  the
                </span>
              </span>

              <span class="inline-block overflow-hidden align-bottom">
                <span
                  class="inline-block animate-[text-reveal_1s_cubic-bezier(0.77,0,0.175,1)_both] [animation-delay:0.3s]"
                >
                  medias
                </span>
              </span>

              <span class="inline-block overflow-hidden align-bottom">
                <span
                  class="inline-block animate-[text-reveal_1s_cubic-bezier(0.77,0,0.175,1)_both] [animation-delay:0.35s]"
                >
                  you
                </span>
              </span>

              <span class="inline-block overflow-hidden align-bottom">
                <span
                  class="inline-block animate-[text-reveal_1s_cubic-bezier(0.77,0,0.175,1)_both] [animation-delay:0.4s]"
                >
                  never
                </span>
              </span>

              <span class="inline-block overflow-hidden align-bottom">
                <span
                  class="inline-block animate-[text-reveal_1s_cubic-bezier(0.77,0,0.175,1)_both] [animation-delay:0.45s]"
                >
                  want
                </span>
              </span>

              <span class="inline-block overflow-hidden align-bottom">
                <span
                  class="inline-block animate-[text-reveal_1s_cubic-bezier(0.77,0,0.175,1)_both] [animation-delay:0.5s]"
                >
                  to
                </span>
              </span>

              <span class="inline-block overflow-hidden align-bottom">
                <span
                  class="inline-block animate-[text-reveal_1s_cubic-bezier(0.77,0,0.175,1)_both] [animation-delay:0.55s]"
                >
                  forget.
                </span>
              </span>
            </h1>
            <!-- Description -->
            <p
              class="mt-3 max-w-2xl text-sm text-gray-600 sm:text-base dark:text-gray-400"
            >
              Find your next favorite media, build your personal watchlist, and
              keep track of everything you want to watch.
            </p>
            <!-- Search -->
            <form class="search-form relative w-full max-w-xl">
              <input
                type="search"
                placeholder="Search media..."
                class="search-media m-auto w-full rounded-xl border border-zinc-200/70 bg-zinc-100/70 px-4 py-2 pr-11 text-sm text-zinc-800 backdrop-blur-md transition-all duration-300 ease-out outline-none placeholder:text-zinc-400 focus:border-amber-500/60 focus:bg-zinc-100/80 focus:ring-2 focus:ring-amber-500/15 dark:border-white/10 dark:bg-white/5 dark:text-white dark:placeholder:text-zinc-500 dark:focus:bg-white/10"
                name="search"
                autocomplete="off"
              />

              <button
                type="button"
                class="btn-clear absolute top-1/2 right-12 hidden h-8 w-8 -translate-y-1/2 items-center justify-center rounded-lg transition-colors duration-200 hover:bg-zinc-900/10 dark:hover:bg-white/10"
              >
                <img
                  src="./img/icons/close.svg"
                  alt="Clear search"
                  class="h-4 w-4"
                />
              </button>
              <div class="group">
                <button
                  type="submit"
                  class="btn-search absolute top-1/2 right-2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-lg transition-colors duration-200 hover:bg-zinc-900/10 dark:hover:bg-white/10"
                >
                  <img
                    src="./img/icons/search.svg"
                    alt="search"
                    class="h-5 w-5"
                  />
                </button>

                <span
                  class="tooltip invisible absolute right-0 bottom-full mb-2 rounded-full border border-zinc-200/70 bg-zinc-100/80 px-2 py-1 text-sm font-bold whitespace-nowrap text-zinc-800 opacity-0 backdrop-blur-md transition-opacity duration-200 group-hover:visible group-hover:opacity-100 lg:top-1 lg:right-auto lg:bottom-auto lg:left-full lg:ml-2 dark:border-white/10 dark:bg-zinc-800/80 dark:text-white"
                >
                  Search
                </span>
              </div>
            </form>

            <!-- Cards Carousel -->
            <!-- <div
              class="section m-0 grid flex-row place-items-center sm:h-[10rem]"
            >
              <div class="flex items-start justify-center [perspective:900px]">
                <div
                  class="hidden h-[clamp(100px,17vw,150px)] w-[120px] [transform-origin:100%_0%] [transform:skewY(6deg)_rotateY(-30deg)] rounded-[20px] bg-red-500 sm:block lg:h-[200px] lg:w-[160px]"
                ></div>

                <div
                  class="[mask-repeat:no-repeat][mask-size:100%_100%] relative mx-[0.5rem] h-[clamp(100px,17vw,150px)] w-[clamp(180px,65vw,300px)] rounded-[20px] bg-purple-400 [mask-image:radial-gradient(ellipse_40.5%_9px_at_50%_0,transparent_0_99%,black_100%)] bg-cover bg-center lg:h-[200px] lg:w-[400px]"
                ></div>

                <div
                  class="hidden h-[clamp(100px,17vw,150px)] w-[120px] [transform-origin:0%_0%] [transform:skewY(-6deg)_rotateY(30deg)] rounded-[20px] bg-blue-500 sm:block lg:h-[200px] lg:w-[160px]"
                ></div>
              </div>
            </div> -->
            <!-- Media Filters -->
            <div
              class="media-filters invisible relative inline-flex items-center gap-0.5 overflow-hidden rounded-xl border border-zinc-200/70 bg-zinc-100/70 p-1 dark:border-white/10 dark:bg-white/5"
            >
              <span
                class="pill absolute top-0 left-1 h-px w-12 rounded-full bg-gradient-to-r from-transparent via-amber-500/90 to-transparent shadow-[0_6px_24px_10px_rgba(245,158,11,0.45)] transition-all duration-300 dark:via-amber-300/80 dark:shadow-[0_6px_24px_10px_rgba(251,191,36,0.35)]"
              ></span>

              <button
                class="media-filter relative z-10 rounded-lg px-2.5 py-1.5 text-xs font-medium text-zinc-600 transition-colors duration-200 hover:text-zinc-950 min-[411px]:px-3 min-[411px]:py-2 min-[411px]:text-sm dark:text-zinc-400 dark:hover:text-white"
              >
                All
              </button>

              <button
                class="media-filter relative z-10 rounded-lg px-2.5 py-1.5 text-xs font-medium text-zinc-600 transition-colors duration-200 hover:text-zinc-950 min-[411px]:px-3 min-[411px]:py-2 min-[411px]:text-sm dark:text-zinc-400 dark:hover:text-white"
                data-type="movie"
              >
                Movies
              </button>

              <button
                class="media-filter relative z-10 rounded-lg px-2.5 py-1.5 text-xs font-medium text-zinc-600 transition-colors duration-200 hover:text-zinc-950 min-[411px]:px-3 min-[411px]:py-2 min-[411px]:text-sm dark:text-zinc-400 dark:hover:text-white"
                data-type="tv"
              >
                TV Shows
              </button>
            </div>
            <!-- Search Results Container -->
            <div
              class="search-results-container grid grid-cols-1 gap-4 p-3 min-[411px]:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"
            ></div>
            <!-- Sentinel -->
            <div class="pagination-loader hidden min-h-[200px]"></div>
            <div class="sentinel h-1"></div>
          </div>
        </main>
        <!-- Toast -->
        <div
          class="toast fixed top-1/2 left-1/2 z-50 hidden -translate-x-1/2 -translate-y-1/2 [animation:border_4s_linear_infinite] rounded-xl border-2 border-transparent px-4 py-3 text-center text-sm text-zinc-900 shadow-lg [background:linear-gradient(white,white)_padding-box,conic-gradient(from_var(--border-angle),transparent_25%,var(--toast-color)_50%,transparent_75%)_border-box] dark:text-white dark:[background:linear-gradient(#18181b,#18181b)_padding-box,conic-gradient(from_var(--border-angle),transparent_25%,var(--toast-color)_50%,transparent_75%)_border-box]"
        >
          <span class="toast-message"></span>
        </div>
        <!-- Bottom Glow -->
        <div
          class="pointer-events-none absolute right-0 bottom-0 h-[700px] w-full bg-[radial-gradient(circle_500px_at_0%_100%,rgba(250,204,21,0.22),transparent)]"
        ></div>
      </div>
    </div>

    <!-- script -->
    <script type="module" src="./js/controllers/controller.js"></script>
  </body>
</html>
